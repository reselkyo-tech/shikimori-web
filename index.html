<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shikimori - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="style.css">
  <style>
    body { align-items: center; }
    .login-container { width: 100%; max-width: 400px; padding: 20px; }
    .web-title { text-align: center; font-size: 28px; font-weight: 700; margin-bottom: 30px; }
    .login-card { background: #0d0d12; border: 1px solid #1f1f27; border-radius: 24px; padding: 30px 25px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .card-indicator { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 60px; height: 4px; background: #a855f7; border-radius: 0 0 10px 10px; }
    .login-card h2 { text-align: center; font-size: 20px; margin-bottom: 20px; margin-top: 10px; }
    .banner-img { width: 100%; height: 180px; border-radius: 16px; overflow: hidden; margin-bottom: 25px; }
    .banner-img img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 13px; color: #a1a1aa; margin-bottom: 8px; }
    .input-field { display: flex; align-items: center; background: #13131a; border: 1px solid #27272a; border-radius: 12px; padding: 0 15px; height: 50px; transition: border-color 0.3s; }
    .input-field:focus-within { border-color: #a855f7; }
    .input-field i { font-size: 20px; color: #a1a1aa; }
    .input-field input { flex: 1; background: transparent; border: none; outline: none; color: #fff; padding: 0 15px; font-size: 15px; }
    .input-field input::placeholder { color: #52525b; }
    .toggle-password { cursor: pointer; }
    .remember-me { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-size: 14px; color: #d4d4d8; }
    .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #27272a; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #a855f7; }
    input:checked + .slider:before { transform: translateX(20px); }
    .btn-login { width: 100%; height: 52px; background: #c084fc; color: #2e1065; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.3s; }
    .btn-login:hover { background: #a855f7; }
    .divider { display: flex; align-items: center; text-align: center; margin: 25px 0; color: #52525b; font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #27272a; }
    .divider span { padding: 0 15px; }
    .btn-daftar { width: 100%; height: 52px; background: transparent; color: #d4d4d8; border: 1px solid #27272a; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.3s; }
    .footer { text-align: center; margin-top: 30px; }
    .footer a { color: #a855f7; text-decoration: none; font-size: 13px; display: block; margin-bottom: 5px; }
    .footer p { color: #52525b; font-size: 12px; }
  </style>
</head>
<body>
  <div class="login-container">
    <h1 class="web-title">Shikimori</h1>
    <div class="login-card">
      <div class="card-indicator"></div>
      <h2>Login</h2>
      <div class="banner-img"><img src="https://i.pinimg.com/736x/8a/80/2f/8a802f8b3e04ce32eb62f1cc23272b95.jpg" alt="Banner"></div>
      <form id="loginForm" autocomplete="off">
        <div class="input-group"><label>Username</label><div class="input-field"><i class='bx bx-user'></i><input type="text" id="username" placeholder="Shikimori" required></div></div>
        <div class="input-group"><label>Password</label><div class="input-field"><i class='bx bx-lock-alt'></i><input type="password" id="password" placeholder="••••••••" required><i class='bx bx-hide toggle-password' id="togglePass"></i></div></div>
        <div class="remember-me"><span>Simpan login</span><label class="switch"><input type="checkbox" id="remember"><span class="slider round"></span></label></div>
        <button type="submit" class="btn-login">Login <i class='bx bx-right-arrow-alt'></i></button>
      </form>
      <div class="divider"><span>atau</span></div>
      <button type="button" class="btn-daftar" onclick="alert('Fitur daftar belum tersedia.')"><i class='bx bx-user-plus'></i> Daftar</button>
    </div>
    <div class="footer"><a href="#">Syarat & Ketentuan</a><p>Shikimori © Dibuat oleh kurrxd</p></div>
  </div>
  <script>
    const togglePass = document.getElementById('togglePass');
    const passwordInput = document.getElementById('password');
    if (togglePass && passwordInput) {
      togglePass.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        togglePass.classList.toggle('bx-hide');
        togglePass.classList.toggle('bx-show');
      });
    }
    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        if (!user || !pass) { alert('Username dan Password tidak boleh kosong!'); return; }
        const btnLogin = document.querySelector('.btn-login');
        const originalText = btnLogin.innerHTML;
        btnLogin.innerHTML = 'Memproses...'; btnLogin.disabled = true;
        setTimeout(() => {
          btnLogin.innerHTML = originalText; btnLogin.disabled = false;
          window.location.href = 'home.html';
        }, 1000);
      });
    }
  </script>
</body>
</html>
